name: Build iOS App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile PhotoHubCompressor (iOS)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP/Contents/Developer" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          elif [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Generate Xcode project with XcodeGen
        working-directory: ios/PhotoHubCompressor
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          rm -rf PhotoHubCompressor.xcodeproj
          xcodegen generate
          if [ -n "${{ vars.PHOTOHUB_GATEWAY_URL }}" ]; then
            /usr/libexec/PlistBuddy -c "Set :PhotoHubGatewayURL ${{ vars.PHOTOHUB_GATEWAY_URL }}" PhotoHubCompressor/Info.plist
          fi
          if [ -n "${{ vars.PHOTOHUB_PINNED_CERT_SHA256 }}" ]; then
            /usr/libexec/PlistBuddy -c "Delete :PhotoHubPinnedCertSHA256" PhotoHubCompressor/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :PhotoHubPinnedCertSHA256 array" PhotoHubCompressor/Info.plist
            for PIN in $(echo "${{ vars.PHOTOHUB_PINNED_CERT_SHA256 }}" | tr ',' ' '); do
              /usr/libexec/PlistBuddy -c "Add :PhotoHubPinnedCertSHA256: string $PIN" PhotoHubCompressor/Info.plist
            done
          fi

      - name: Build unsigned iOS device app (.app)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project ios/PhotoHubCompressor/PhotoHubCompressor.xcodeproj \
            -scheme PhotoHubCompressor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log; then
            echo "=== XCODEBUILD ERRORS ==="
            ERRORS=$(grep -nE -A 2 "error:|fatal error:" build.log | head -n 80 || true)
            if [ -z "$ERRORS" ]; then
              ERRORS=$(tail -n 80 build.log)
            fi
            echo "$ERRORS"
            {
              echo "### xcodebuild Failed (exit code 65)"
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 65
          fi

      - name: Verify Info.plist privacy keys are in the built app
        run: |
          PLIST=build/DerivedData/Build/Products/Release-iphoneos/PhotoHubCompressor.app/Info.plist
          plutil -p "$PLIST"
          for KEY in NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription UILaunchStoryboardName CFBundleDisplayName; do
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              echo "::error::Missing $KEY in built Info.plist - app would crash or misbehave"
              exit 1
            fi
          done
          echo "All required Info.plist keys present."

      - name: Package unsigned IPA for sideloading
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PhotoHubCompressor.app build/ipa/Payload/
          cd build/ipa
          zip -r -y ../PhotoHubCompressor-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoHubCompressor-unsigned-ipa
          path: build/PhotoHubCompressor-unsigned.ipa
          retention-days: 30
