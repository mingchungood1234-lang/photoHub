name: PhotoHubCompressor
options:
  bundleIdPrefix: com.photohub
  deploymentTarget:
    iOS: "17.0"
targets:
  PhotoHubCompressor:
    type: application
    platform: iOS
    sources:
      - PhotoHubCompressor
    info:
      path: PhotoHubCompressor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photohub.compressor
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
