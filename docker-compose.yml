services:
  photohub:
    build: .
    container_name: photohub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - WEB_PORT=${WEB_PORT:-4000}
      - STORAGE_DIR=/storage
      - DATA_DIR=/app/data
    volumes:
      # Bind-mount the Ubuntu host folder /home/ubuntu/gdrive/photoHUB into /storage inside the container
      - ${HOST_STORAGE_DIR:-/home/ubuntu/gdrive/photoHUB}:/storage
      # Persist the SHA-256 hash index on the host across container rebuilds
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get({ host: '127.0.0.1', port: process.env.PORT || 3000, path: '/api/health', timeout: 4000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
